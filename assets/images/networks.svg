<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="#0a0912" />
  
  <!-- Network Nodes -->
  <circle cx="70" cy="70" r="12" fill="#db01f9" />
  <circle cx="140" cy="60" r="10" fill="#0071f8" />
  <circle cx="130" cy="130" r="14" fill="#db01f9" />
  <circle cx="60" cy="120" r="8" fill="#0071f8" />
  
  <!-- Connection Lines -->
  <line x1="70" y1="70" x2="140" y2="60" stroke="#db01f9" stroke-width="3" opacity="0.7" />
  <line x1="140" y1="60" x2="130" y2="130" stroke="#0071f8" stroke-width="3" opacity="0.7" />
  <line x1="130" y1="130" x2="60" y2="120" stroke="#db01f9" stroke-width="3" opacity="0.7" />
  <line x1="60" y1="120" x2="70" y2="70" stroke="#0071f8" stroke-width="3" opacity="0.7" />
  
  <!-- Text -->
  <text x="100" y="160" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">PROJECT NETWORKS</text>
  
  <!-- Initials -->
  <text x="100" y="105" font-family="Inter, sans-serif" font-size="40" font-weight="900" fill="white" text-anchor="middle">PN</text>
