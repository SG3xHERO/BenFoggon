version: '3.8'

services:
  # Frontend - Static website served by Nginx
  benfoggon-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benfoggon-portfolio
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - benfoggon-api
    networks:
      - web
    environment:
      - API_URL=http://benfoggon-api:3001

  # Backend - Spotify API server
  benfoggon-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: benfoggon-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN}
      - ALLOWED_ORIGINS=https://benfoggon.com,http://localhost:8082
    networks:
      - web
    healthcheck:
      test: ["CMD", "node", "-e", "http.get('http://localhost:3001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Reverse proxy (optional - for production with custom domains)
  nginx-proxy:
    image: nginx:alpine
    container_name: benfoggon-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - benfoggon-site
      - benfoggon-api
    networks:
      - web
    profiles:
      - production

networks:
  web:
    driver: bridge
