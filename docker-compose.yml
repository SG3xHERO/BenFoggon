version: '3.8'

services:
  # Frontend - Static website served by Nginx
  benfoggon-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benfoggon-portfolio
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - benfoggon-api
    networks:
      - web
    environment:
      - API_URL=http://benfoggon-api:3001
    labels:
      - "traefik.enable=false"  # Disable if using Traefik

  # Backend - Spotify API server
  benfoggon-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: benfoggon-api
    restart: unless-stopped
    expose:
      - "3001"  # Expose port internally for Nginx Proxy Manager
    ports:
      - "3001:3001"  # Also expose externally for direct access if needed
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN}
      - ALLOWED_ORIGINS=https://benfoggon.com,http://localhost:8082,https://api.benfoggon.com
      - SPOTIFY_REDIRECT_URI=https://api.benfoggon.com/auth/callback
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health", "||" , "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=false"  # Disable if using Traefik

  # Reverse proxy (optional - for production with custom domains)
  nginx-proxy:
    image: nginx:alpine
    container_name: benfoggon-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - benfoggon-site
      - benfoggon-api
    networks:
      - web
    profiles:
      - production

networks:
  web:
    driver: bridge
