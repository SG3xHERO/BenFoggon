# Portainer Stack for Ben Foggon Portfolio
# Use this in Portainer instead of docker-compose.yml

version: '3.8'

services:
  # Frontend - Static website served by Nginx
  benfoggon-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benfoggon-portfolio
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - benfoggon-api
    environment:
      - API_URL=http://benfoggon-api:3001

  # Backend - Spotify API server
  benfoggon-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: benfoggon-api
    restart: unless-stopped
    expose:
      - "3001"
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN}
      - ALLOWED_ORIGINS=https://benfoggon.com,http://localhost:8082,https://api.benfoggon.com
      - SPOTIFY_REDIRECT_URI=https://api.benfoggon.com/auth/callback
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health", "||" , "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Note: When using Nginx Proxy Manager, you don't need the nginx-proxy service
# Configure your domains in Nginx Proxy Manager UI:
# - Frontend: benfoggon.com -> benfoggon-portfolio:80
# - API: api.benfoggon.com -> benfoggon-api:3001